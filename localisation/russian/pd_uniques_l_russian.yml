###Crystal World
 sr_acean:0 "Асеанский кристалл"
 sr_acean_desc:0 "Уникальный резонанс этого кристалла усиливает регенерацию и рост органических форм жизни."
 mod_planet_miners_sr_acean_produces_add: "£sr_acean£ асеанские кристаллы от £job_miner£ шахтёров"
 pd_crystal: "Мир кристаллов"
 pd_crystal_desc: "Поверхность планеты покрыта огромными асеанскими кристаллами, чей уникальный резонанс положительно влияет на регенерацию и рост местных органических форм жизни."
 pd_dead_crystal: "Мёртвый мир кристаллов"
 pd_dead_crystal_desc: "Суперорганизм, породивший асеанские кристаллы, мёртв. Он больше не оказывает положительного эффекта на местную органическую жизнь, впрочем, кристаллов теперь можно добывать больше и без опаски."
 pd_living_crystal: "Восстановленный мир кристаллов"
 pd_living_crystal_desc: "Суперорганизм, породивший асеанские кристаллы, снова жив, а его положительное влияние на местную органическую жизнь восстановлено. Добыча кристаллов тоже выросла, хотя голодное существо продолжает пожирать всех, кого сможет поймать."
 pc_pd_crystal: "Мир кристаллов"
 pc_pd_crystal_desc: "$pd_crystal_desc$"
 pc_pd_crystal_adj: "кристальная"
 mod_pc_pd_crystal_habitability: "Приспособленность к миру кристаллов"
 trait_pc_pd_crystal_preference: "Предпочтителен мир кристаллов"
 trait_pc_pd_crystal_preference_desc: "$trait_pc_arctic_preference_desc$"
 d_pd_khel_ruins: "Руины поселения келов"
 d_pd_khel_ruins_desc: "Остатки погибшей колонии, включая гигантские исследовательские скважины, занимают отдельный участок этой планеты."
 d_pd_acean_pillars: "Асеанские столпы"
 d_pd_acean_pillars_desc: "Поверхность этой планеты покрыта столпами асеанских кристаллов, связанными с чем-то, находящимся внутри коры. Кристаллы положительно влияют на эмоции и фертильность органиков."

 #Events
 pdcrystal.100.name: "Камень Жизни"
 pdcrystal.100.desc: "Глубокое сканирование §Y[From.GetName]§! показало нечто уникальное: по всей поверхности возвышаются огромные кристаллические формации, которые мы назвали §Yасеанскими кристаллами§!. Эти драгоценные камни положительно влияют на злоровье местной органической жизни, и, что удивительно, эффект сохраняется даже у изолированных образцов кристалла.\n\n§Y[Root.GetLeaderName]§! [Root.GetAXX::обнаружил|||fem:обнаружила] признаки колонии в джунглях, однако, добраться до них мы сможем, лишь имея контроль над планетой."
 pdcrystal.100.a: "Изумительно."
 pdcrystal.200.name: "Руины в джунглях"
 pdcrystal.200.desc: "Как только обустройство колонии на §Y[Root.GetName]§! было завершено, мы обнаружили, что руины, найденные при сканировании поверхности планеты, были не единственными. Однако всё, что нам удалось найти - несколько брошенных аванпостов в глуши, разрушенных непогодой.\n\nКто здесь жил и что с ними стало, остаётся неясным."
 pdcrystal.200.a: "Давайте исследуем эти развалины."
 pdcrystal.300.name: "Судьба планеты"
 pdcrystal.300.desc: "Теперь мы знаем о тёмной стороне асеанских кристаллов и о том, что случилось с келами. И отсюда следует три варианта: оставить суперорганизм как есть, добить его, или восстановить его к исходному состоянию.\n\nСо смертью чудовища станет проще добывать больше кристаллов, но о положительном эффекте на органическую жизнь можно будет забыть. Вылеченное существо, напротив, усилит этот эффект ценой повышенного риска смертей колонистов, что, впрочем, можно попытаться скомпенсировать дополнительными мерами безопасности."
 pdcrystal.300.a: "Его лоботомировали не просто так."
 pdcrystal.300.a.tooltip: "Мы оставим суперорганизм нетронутым, наша жизнь на планете останется прежней."
 pdcrystal.300.b: "Мы покончим с этой тварью."
 pdcrystal.300.b.tooltip: "Мы закончим дело келов и добьём чудовище. Это повысит производство асеанских кристаллов, но отменит влияние на органическую жизнь."
 pdcrystal.300.c: "Мы должны исправить эту несправедливую ошибку."
 pdcrystal.300.c.tooltip: "Лечение кельской лоботомии восстановит суперорганизм, его влияние на организмы заработает в полную силу, а добыча асеанских кристаллов немного повысится. Впрочем, существо вернётся к охоте, в том числе на колонистов."

 #Archaeology Site
 pdcrystal_site: "Заросшие руины"
 pdcrystal_site_desc: "Отдельный участок планеты занимают заброшенные руины. Тщательное исследование поможет нам выяснить природу уникальных асеанских кристаллов и причины их сильного влияния на живые организмы."
 pdcrystal.250.name: "Руины келов"
 pdcrystal.250.desc: "Джунгли поглотили большую часть разрушающихся баз и находящихся там технологий, но нам удалось добыть кое-какую полезную информацию. Келы, которые были такими же пришельцами, как и мы, проводили масштабный эксперимент по глубокому бурению земной коры.\n\nХоть большая часть данных была повреждена, мы нашли сведения о крупном неоткрытом поселении келов неподалеку от нашего исследовательского пункта."
 pdcrystal.250.a: "Занятно."
 pdcrystal.251.desc: "В поселении мы нашли останки корабля поколений, очевидно, не имевшего гипердвигателя. Келы, спасаясь от климатической катастрофы на своей родной планете, несколько поколений скитались по различным системам. В конце концов они нашли эту планету, которая, казалось, удовлетворяла всем их потребностям, и начали строить новый дом.\n\nОстальное узнаем при дальнейшем исследовании записей келов."
 ancrel.251.a: "Как им повезло."
 pdcrystal.252.desc: "Колония преуспевала в течение нескольких лет благодаря кристаллическим столпам, которые повышали урожайность высаженных культур. И всё же, со временем начали пропадать колонисты. Поначалу это казалось случайностью, но частота исчезновений неуклонно росла. Расследование привело к шокирующим результатам: планета была живой... и она питалась ими. Не имея возможности перезапустить корабль, келы сконцентрировались на попытке установить контакт и умиротворить чудовище.\n\nПохоже, нам пора приступать к исследованию одной из скважин."
 pdcrystal.252.a: "Колония в опасности?"
 pdcrystal.253.desc: "Исследование показало, что кристаллы - часть литоидного суперорганизма с остатками сознания, использующего асеанские столпы для заманивания животных в спрятанные воронки. Келы пробурили скважины и пустили мощный ЭМИ, чтобы разрушить этот способ питания существа, но сохранить уникальные свойства кристаллов.\n\nТакже мы обнаружили центр по управлению проектом бурения, расследование будет продолжено."
 pdcrystal.253.a: "Видимо, они совсем отчаялись."
 pdcrystal.254.desc: "Скважины, пробуренные келами, лишь помогли существу питаться, а, может, это была защитная реакция. Когда же оружие было готово, их оставалось лишь несколько дюжин. Взрыв привёл к высокому выбросу энергии, и записи келов на этом моменте обрываются.\n\nХоть сами келы не дожили до этого момента, он оказались правы: планета потеряла возможность питаться привычным способом. Нам же стала известна тёмная сущность силы асеанских кристаллов."
 pdcrystal.254.a: "Ужасный конец. Для обоих."

 #Origin
 pd_origin_init_crystal_NAME:0 "Система с миром кристаллов"
 pd_origin_init_crystal_DESC:0 "В стартовой системе присутствует уникальный мир кристаллов"
 pd_origin_init_crystal_NAME:0 "Система с миром кристаллов"
 pd_origin_init_crystal_DESC:0 "В стартовой системе присутствует уникальный мир кристаллов"
 origin_pd_crystal_world:0 "Камнерождённые"
 origin_pd_crystal_world_desc:0 "Эта цивилизация развилась на зелёной планете, на чьей поверхности то тут, то там возвышаются огромные столпы из редких асеанских кристаллов."
