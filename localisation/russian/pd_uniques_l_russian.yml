 origin_pd_floating_world:0 "Острова в небе"
 origin_pd_floating_world_desc:0 "Эта цивилизация развилась на планете, аналога которой не существует во всей галактике. В их, и только их родном мире есть парящие небесные острова и редчайший элюдий."
